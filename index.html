<!doctype html>
<html class="no-js" lang="en">

<head>
    <meta charset="utf-8">
    <meta http-equiv="x-ua-compatible" content="ie=edge">
    <title>Login- thecontroll</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="shortcut icon" type="image/png" href="">
    <link rel="stylesheet" href="recuros/assets/css/bootstrap.min.css">
    <link rel="stylesheet" href="recuros/assets/css/font-awesome.min.css">
    <link rel="stylesheet" href="recuros/assets/css/themify-icons.css">
    <link rel="stylesheet" href="recuros/assets/css/metisMenu.css">
    <link rel="stylesheet" href="recuros/assets/css/owl.carousel.min.css">
    <link rel="stylesheet" href="recuros/assets/css/slicknav.min.css">
    <!-- amchart css -->
    <link rel="stylesheet" href="https://www.amcharts.com/lib/3/plugins/export/export.css" type="text/css"
        media="all" />
    <!-- others css -->
    <link rel="stylesheet" href="recuros/assets/css/typography.css">
    <link rel="stylesheet" href="recuros/assets/css/default-css.css">
    <link rel="stylesheet" href="recuros/assets/css/styles.css">
    <link rel="stylesheet" href="recuros/assets/css/responsive.css">
    <script src="recuros/assets/js/vendor/modernizr-2.8.3.min.js"></script>
    <!-- Adicionar SweetAlert2 -->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    

</head>

<body>
    <!--[if lt IE 8]>
            <p class="browserupgrade">You are using an <strong>outdated</strong> browser. Please <a href="http://browsehappy.com/">upgrade your browser</a> to improve your experience.</p>
        <![endif]-->
    <!-- preloader area start -->
    <div id="preloader">
        <div class="loader"></div>
    </div>
    <!-- preloader area end -->
    <!-- login area start -->
    <div class="login-area login-bg">
        <div class="container">
            <div class="login-box ptb--100">
                <form id="loginForm">
                    <div class="login-form-head">
                        <h4 class="text-left">Entrar</h4>
                        <p class="text-left">Olá, faça login e comece a gerenciar mmmm suas finanças com eficiência</p>

                    </div>
                    <div class="login-form-body">
                        <div class="form-gp">
                            <label for="exampleInputEmail1">Endereço de Email</label>
                            <input type="email" id="exampleInputEmail1">
                            <i class="ti-email"></i>
                        </div>
                        <div class="form-gp">
                            <label for="exampleInputPassword1">Senha</label>
                            <input type="password" id="exampleInputPassword1">
                            <i class="ti-lock" id="passwordIcon"></i>
                        </div>
                        <div class="row mb-4 rmber-area">
                            <div class="col-6">
                                <div class="custom-control custom-checkbox mr-sm-2">
                                    <input type="checkbox" class="custom-control-input" id="customControlAutosizing"
                                        style="cursor: pointer;">
                                    <label class="custom-control-label" for="customControlAutosizing"
                                        style="cursor: pointer;">Lembrar-me</label>
                                </div>
                            </div>
                            <div class="col-6 text-right">
                                <a href="views/esqueceu_senha/index.html">Esqueceu a senha?</a>
                            </div>
                        </div>
                        <div class="submit-btn-area">
                            <button id="form_submit" type="submit">Enviar <i class="ti-arrow-right"></i></button>
                        </div>
                        <div class="form-footer text-center mt-5">
                            <p class="text-muted">Não tem uma conta? <a href="views/nova_conta/index.html">Cadastre-se</a>
                            </p>
                        </div>
                        <div id="responseMessage" class="mt-3"></div>
                        <div id="tokenDisplay" class="mt-3"></div>
                    </div>
                </form>

            </div>
        </div>
    </div>
    <script src="recuros/assets/js/vendor/jquery-2.2.4.min.js"></script>
    <!-- bootstrap 4 js -->
    <script src="recuros/assets/js/popper.min.js"></script>
    <script src="recuros/assets/js/bootstrap.min.js"></script>
    <script src="recuros/assets/js/owl.carousel.min.js"></script>
    <script src="recuros/assets/js/metisMenu.min.js"></script>
    <script src="recuros/assets/js/jquery.slimscroll.min.js"></script>
    <script src="recuros/assets/js/jquery.slicknav.min.js"></script>

    <!-- others plugins -->
    <script src="recuros/assets/js/vendor.min.js"></script>
    <script src="recuros/assets/js/scripts.js"></script>
    <script type="module" src="recuros/api/login/login.js"></script>
    <script>
        document.getElementById("passwordIcon").addEventListener("click", function () {
            var passwordInput = document.getElementById("exampleInputPassword1");

            // Alternar entre "password" e "text"
            if (passwordInput.type === "password") {
                passwordInput.type = "text";
                this.classList.remove("ti-lock");
                this.classList.add("ti-unlock");
            } else {
                passwordInput.type = "password";
                this.classList.remove("ti-unlock");
                this.classList.add("ti-lock");
            }
        });
    </script>
</body>

</html>
