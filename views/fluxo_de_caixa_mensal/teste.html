<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Plano de Contas</title>
    <style>
        table {
            width: 100%;
            border-collapse: collapse;
            font-family: Arial, sans-serif;
        }
        th, td {
            border: 1px solid #ddd;
            padding: 8px;
            text-align: right;
        }
        th {
            background-color: #f2f2f2;
            text-align: center;
        }
        .category {
            font-weight: bold;
            background-color: #e6f3ff;
        }
        .account {
            padding-left: 20px !important;
            background-color: #f0f8ff;
        }
        .subaccount {
            padding-left: 40px !important;
        }
        .toggle-btn {
            cursor: pointer;
            color: blue;
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <table id="tabela-contas">
        <thead>
            <tr>
                <th>Conta</th>
                <th>Janeiro Total</th>
                <th>Média</th>
                <th>AV</th>
                <th>AH</th>
                <th>Fevereiro Total</th>
                <th>Média</th>
                <th>AV</th>
                <th>AH</th>
                <th>Março Total</th>
                <th>Média</th>
                <th>AV</th>
                <th>AH</th>
                <th>Abril Total</th>
                <th>Média</th>
                <th>AV</th>
                <th>AH</th>
                <th>Maio Total</th>
                <th>Média</th>
                <th>AV</th>
                <th>AH</th>
                <th>Junho Total</th>
                <th>Média</th>
                <th>AV</th>
                <th>AH</th>
            </tr>
        </thead>
        <tbody id="tabela-contas-body">
            <!-- As linhas serão preenchidas pelo JavaScript -->
        </tbody>
    </table>

    <script>
        // Dados mockados para exemplo (substitua pela sua API real)
        const mockData = [
            {
                id: 1,
                nome: "1. Receita Bruta",
                contas: [
                    {
                        id: 1,
                        nome: "1.1 Vendas de Produtos",
                        subcontas: [],
                        valores: {
                            janeiro: { total: "850.000,00", media: "283.333,33", av: "100%", ah: "15,2%" },
                            fevereiro: { total: "980.000,00", media: "326.666,67", av: "100%", ah: "15,3%" },
                            marco: { total: "980.000,00", media: "326.666,67", av: "100%", ah: "15,3%" },
                            abril: { total: "980.000,00", media: "326.666,67", av: "100%", ah: "15,3%" },
                            maio: { total: "980.000,00", media: "326.666,67", av: "100%", ah: "15,3%" },
                            junho: { total: "980.000,00", media: "326.666,67", av: "100%", ah: "15,3%" }
                        }
                    },
                    {
                        id: 2,
                        nome: "1.2 Vendas de Serviços",
                        subcontas: [],
                        valores: {
                            janeiro: { total: "200.000,00", media: "66.666,67", av: "23,5%", ah: "2,4%" },
                            fevereiro: { total: "230.000,00", media: "76.666,67", av: "23,5%", ah: "3,6%" },
                            marco: { total: "250.000,00", media: "83.333,33", av: "25,5%", ah: "3,9%" },
                            abril: { total: "270.000,00", media: "90.000,00", av: "27,5%", ah: "4,2%" },
                            maio: { total: "300.000,00", media: "100.000,00", av: "30,5%", ah: "4,6%" },
                            junho: { total: "320.000,00", media: "106.666,67", av: "32,5%", ah: "4,9%" }
                        }
                    }
                ]
            }
        ];

        function preencherTabela(categorias) {
            const tbody = document.getElementById("tabela-contas-body");

            categorias.forEach(categoria => {
                // Linha da categoria (principal)
                const rowCategoria = document.createElement("tr");
                rowCategoria.className = "category";
                rowCategoria.innerHTML = `
                    <td colspan="1"><strong>${categoria.nome}</strong></td>
                    <td>${categoria.contas[0].valores.janeiro.total}</td>
                    <td>${categoria.contas[0].valores.janeiro.media}</td>
                    <td>${categoria.contas[0].valores.janeiro.av}</td>
                    <td>${categoria.contas[0].valores.janeiro.ah}</td>
                    <td>${categoria.contas[0].valores.fevereiro.total}</td>
                    <td>${categoria.contas[0].valores.fevereiro.media}</td>
                    <td>${categoria.contas[0].valores.fevereiro.av}</td>
                    <td>${categoria.contas[0].valores.fevereiro.ah}</td>
                    <td>${categoria.contas[0].valores.marco.total}</td>
                    <td>${categoria.contas[0].valores.marco.media}</td>
                    <td>${categoria.contas[0].valores.marco.av}</td>
                    <td>${categoria.contas[0].valores.marco.ah}</td>
                    <td>${categoria.contas[0].valores.abril.total}</td>
                    <td>${categoria.contas[0].valores.abril.media}</td>
                    <td>${categoria.contas[0].valores.abril.av}</td>
                    <td>${categoria.contas[0].valores.abril.ah}</td>
                    <td>${categoria.contas[0].valores.maio.total}</td>
                    <td>${categoria.contas[0].valores.maio.media}</td>
                    <td>${categoria.contas[0].valores.maio.av}</td>
                    <td>${categoria.contas[0].valores.maio.ah}</td>
                    <td>${categoria.contas[0].valores.junho.total}</td>
                    <td>${categoria.contas[0].valores.junho.media}</td>
                    <td>${categoria.contas[0].valores.junho.av}</td>
                    <td>${categoria.contas[0].valores.junho.ah}</td>
                `;
                tbody.appendChild(rowCategoria);

                // Contas (subitens)
                categoria.contas.forEach(conta => {
                    // Linha da conta
                    const rowConta = document.createElement("tr");
                    rowConta.className = "account";
                    rowConta.innerHTML = `
                        <td>${conta.nome}</td>
                        <td>${conta.valores.janeiro.total}</td>
                        <td>${conta.valores.janeiro.media}</td>
                        <td>${conta.valores.janeiro.av}</td>
                        <td>${conta.valores.janeiro.ah}</td>
                        <td>${conta.valores.fevereiro.total}</td>
                        <td>${conta.valores.fevereiro.media}</td>
                        <td>${conta.valores.fevereiro.av}</td>
                        <td>${conta.valores.fevereiro.ah}</td>
                        <td>${conta.valores.marco.total}</td>
                        <td>${conta.valores.marco.media}</td>
                        <td>${conta.valores.marco.av}</td>
                        <td>${conta.valores.marco.ah}</td>
                        <td>${conta.valores.abril.total}</td>
                        <td>${conta.valores.abril.media}</td>
                        <td>${conta.valores.abril.av}</td>
                        <td>${conta.valores.abril.ah}</td>
                        <td>${conta.valores.maio.total}</td>
                        <td>${conta.valores.maio.media}</td>
                        <td>${conta.valores.maio.av}</td>
                        <td>${conta.valores.maio.ah}</td>
                        <td>${conta.valores.junho.total}</td>
                        <td>${conta.valores.junho.media}</td>
                        <td>${conta.valores.junho.av}</td>
                        <td>${conta.valores.junho.ah}</td>
                    `;
                    tbody.appendChild(rowConta);

                    // Subcontas (se houver)
                    conta.subcontas.forEach(subconta => {
                        const rowSubconta = document.createElement("tr");
                        rowSubconta.className = "subaccount";
                        rowSubconta.style.display = "none";
                        rowSubconta.setAttribute("data-parent", conta.id);
                        rowSubconta.innerHTML = `
                            <td>${subconta.nome}</td>
                            <td>${subconta.valores.janeiro.total}</td>
                            <td>${subconta.valores.janeiro.media}</td>
                            <td>${subconta.valores.janeiro.av}</td>
                            <td>${subconta.valores.janeiro.ah}</td>
                            <!-- Repetir para os outros meses -->
                        `;
                        tbody.appendChild(rowSubconta);
                    });
                });
            });

            // Adicionar evento de clique para mostrar/esconder subcontas
            document.querySelectorAll('.account').forEach(row => {
                row.addEventListener('click', function() {
                    const parentId = this.querySelector('td').textContent.split('.')[0];
                    const subcontas = document.querySelectorAll(`tr.subaccount[data-parent="${parentId}"]`);
                    
                    subcontas.forEach(sub => {
                        sub.style.display = sub.style.display === 'none' ? 'table-row' : 'none';
                    });
                });
            });
        }

        // Inicializar a tabela com os dados mockados
        document.addEventListener('DOMContentLoaded', function() {
            preencherTabela(mockData);
        });

        // Função para buscar dados da API (como no seu exemplo original)
        async function fetchPlanodeContas() {
            try {
                // Substitua pela sua chamada API real
                // const response = await fetch(`${API_CONFIG.BASE_URL}/categoria-de-conta`, {...});
                // const result = await response.json();
                // preencherTabela(result.data || result);
                
                // Usando dados mockados para exemplo
                preencherTabela(mockData);
            } catch (error) {
                console.error("Erro:", error.message);
            }
        }
    </script>
</body>
</html>
