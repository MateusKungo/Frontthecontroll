<!doctype html>
<html class="no-js" lang="en">

<head>
    <meta charset="utf-8">
    <meta http-equiv="x-ua-compatible" content="ie=edge">
    <title>Cadastro de Empresa- thecontroll</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="shortcut icon" type="image/png" href="../../recuros/assets/images/icon/favicon.ico">
    <link rel="stylesheet" href="../../recuros/assets/css/bootstrap.min.css">
    <link rel="stylesheet" href="../../recuros/assets/css/font-awesome.min.css">
    <link rel="stylesheet" href="../../recuros/assets/css/themify-icons.css">
    <link rel="stylesheet" href="../../recuros/assets/css/metisMenu.css">
    <link rel="stylesheet" href="../../recuros/assets/css/owl.carousel.min.css">
    <link rel="stylesheet" href="../../recuros/assets/css/slicknav.min.css">

    <!-- amchart css -->
    <link rel="stylesheet" href="https://www.amcharts.com/lib/3/plugins/export/export.css" type="text/css"
        media="all" />
    <!-- others css -->
    <link rel="stylesheet" href="../../recuros/assets/css/typography.css">
    <link rel="stylesheet" href="../../recuros/assets/css/default-css.css">
    <link rel="stylesheet" href="../../recuros/assets/css/styles.css">
    <link rel="stylesheet" href="../../recuros/assets/css/responsive.css">

    <!-- modernizr css -->
    <script src="../../recuros/assets/js/vendor/modernizr-2.8.3.min.js"></script>

    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

</head>

<body class="">
    <!--[if lt IE 8]>
            <p class="browserupgrade">You are using an <strong>outdated</strong> browser. Please <a href="http://browsehappy.com/">upgrade your browser</a> to improve your experience.</p>
        <![endif]-->
    <!-- preloader area start -->
    <div id="preloader">
        <div class="loader"></div>
    </div>
    <!-- preloader area end -->
    <!-- login area start -->
    <div class="login-area login-bg">
        <div class="container">
            <div class="login-box ptb--100">
                <form id="userForm">
                    <div class="login-form-head">
                        <h4 class="text-left">The Controll</h4>
                        <p class="text-left">Bem-vindo ao <strong>The Controll</strong>, o seu sistema de gestão de
                            finanças empresariais. Cadastre-se e tenha controle total sobre as finanças do seu negócio!
                        </p>

                    </div>
                    <div class="login-form-body">
                        <div class="row">
                            <div class="col-md-6">
                                <div class="form-gp">
                                    <label for="exampleInputName1">Nome Empresa</label>
                                    <input type="text" id="exampleInputName1" required>
                                    <i class="ti-user"></i>
                                </div>
                            </div>
                            <div class="col-md-6">
                                <div class="form-gp">
                                    <label for="exampleInputCNPJ1">CNPJ</label>
                                    <input type="text" id="exampleInputCNPJ1" required>
                                    <i class="ti-id-badge"></i>
                                </div>
                            </div>
                        </div>
                        <div class="form-gp">
                            <label for="endereco">Endereço</label>
                            <input type="text" id="endereco" required>
                            <i class="ti-location-pin"></i>
                        </div>
                        <div class="row">
                            <div class="col-md-6">
                                <div class="form-gp">
                                    <label for="telefone">Telefone</label>
                                    <input type="tel" id="telefone" required>
                                    <i class="ti-mobile"></i>
                                </div>

                            </div>

                            <div class="col-md-6">
                                <div class="form-gp">
                                    <label for="exampleInputEmail1">Email</label>
                                    <input type="email" id="exampleInputEmail1" required>
                                    <i class="ti-email"></i>
                                </div>
                            </div>
                        </div>
                        <label for="moedaPrimicipal">Moeda Principal</label>
                        <div class="form-gp">

                            <select class="form-control" id="moedaPrimicipal" required>
                                <option value="">Selecione</option>
                                <option value="R$">Real Brasileiro</option>
                                <option value="KZ">Kwanza Angolana</option>
                                <option value="USD">Dólar Americano</option>
                                <option value="EUR">Euro</option>
                            </select>
                        </div>
                        <div class="form-gp">
                            <label for="exampleInputPassword1">Palavra-passe</label>
                            <input type="password" id="exampleInputPassword1" required>
                            <i class="ti-lock"></i>
                        </div>
                        <div class="submit-btn-area">
                            <button id="form_submit" type="submit">Criar Conta <i class="ti-arrow-right"></i></button>
                            <div class="login-other row mt-4 justify-content-center">
                                <a class="google-login" href="#">Cadastre-se com <i class="fa fa-google"></i></a>
                            </div>
                        </div>
                        <div class="form-footer text-center mt-5">
                            <p class="text-muted">Já tem uma conta? <a href="../../index.html">Entre</a></p>
                        </div>
                    </div>
                </form>



            </div>
        </div>
    </div>

    <!-- login area end -->
    <div class="position-fixed bottom-0 end-0 p-3" style="z-index: 11">
        <div id="liveToast" class="toast" role="alert" aria-live="assertive" aria-atomic="true">
            <div class="toast-header">

                <strong class="me-auto" id="toastTitle">Mensagem</strong>
                <small id="toastTime">Agora</small>
                <button type="button" class="btn-close" data-bs-dismiss="toast" aria-label="Close"></button>
            </div>
            <div class="toast-body" id="toastBody">
                Mensagem padrão.
            </div>
        </div>
    </div>
    <!-- jquery latest version -->
    <script src="../../recuros/assets/js/vendor/jquery-2.2.4.min.js"></script>
    <!-- bootstrap 4 js -->
    <script src="../../recuros/assets/js/popper.min.js"></script>
    <script src="../../recuros/assets/js/bootstrap.min.js"></script>
    <script src="../../recuros/assets/js/owl.carousel.min.js"></script>
    <script src="../../recuros/assets/js/metisMenu.min.js"></script>
    <script src="../../recuros/assets/js/jquery.slimscroll.min.js"></script>
    <script src="../../recuros/assets/js/jquery.slicknav.min.js"></script>


    <!-- others plugins -->
    <script src="../../recuros/assets/js/plugins.js"></script>
    <script src="../../recuros/assets/js/scripts.js"></script>
    <script type="module" src="../../recuros/api/usuario/postusuario.js"></script>

</body>

</html>
